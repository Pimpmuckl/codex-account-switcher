[package]
name = "codex-account-switcher"
version = "0.1.2"
edition = "2024"
description = "Cross-platform CLI for saving and restoring Codex login snapshots"
license = "MIT"
repository = "https://github.com/Pimpmuckl/codex-account-switcher"
homepage = "https://github.com/Pimpmuckl/codex-account-switcher"
readme = "README.md"
keywords = ["codex", "cli", "accounts", "cross-platform"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.102"
base64 = "0.22.1"
clap = { version = "4.6.0", features = ["derive"] }
console = "0.16.3"
dialoguer = "0.12.0"
directories = "6.0.0"
flate2 = "1.1.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sysinfo = "0.38.4"
time = { version = "0.3.47", features = ["formatting", "parsing", "serde"] }
ureq = { version = "3.1.2", features = ["json"] }
uuid = { version = "1.23.0", features = ["serde", "v4"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "vendored"] }

[dev-dependencies]
tempfile = "3.27.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
