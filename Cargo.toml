[package]
name = "codex-account-switcher"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
base64 = "0.22.1"
clap = { version = "4.6.0", features = ["derive"] }
dialoguer = "0.12.0"
directories = "6.0.0"
keyring = "3.6.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sysinfo = "0.38.4"
time = { version = "0.3.47", features = ["formatting", "parsing", "serde"] }
uuid = { version = "1.23.0", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3.27.0"
