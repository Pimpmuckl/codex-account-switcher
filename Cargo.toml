[package]
name = "codex-account-switcher"
version = "0.1.6"
edition = "2024"
description = "Cross-platform CLI for saving and restoring Codex login snapshots"
license = "MIT"
repository = "https://github.com/Pimpmuckl/codex-account-switcher"
homepage = "https://github.com/Pimpmuckl/codex-account-switcher"
readme = "README.md"
keywords = ["codex", "cli", "accounts", "cross-platform"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.102"
base64 = "0.22.1"
clap = { version = "4.6.0", features = ["derive"] }
console = "0.16.3"
dialoguer = "0.12.0"
directories = "6.0.0"
flate2 = "1.1.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sysinfo = "0.38.4"
time = { version = "0.3.47", features = ["formatting", "local-offset", "parsing", "serde"] }
ureq = { version = "3.1.2", features = ["json"] }
uuid = { version = "1.23.0", features = ["serde", "v4"] }

[target.'cfg(target_os = "windows")'.dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "ico"] }
tray-icon = { version = "0.22.1", default-features = false }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }
winit = { version = "0.30.13", default-features = false }

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1.31"

[dev-dependencies]
tempfile = "3.27.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
